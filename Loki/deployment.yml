apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: RollingUpdate      #aggiunto questa parte per pvc butta giu il pod e poi ne avvia uno nuovo
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.6.3
          ports:
            - containerPort: 3100
          args:
            - "-config.file=/etc/loki/loki.yaml"
          resources:
            requests:
              memory: "256Mi"
              cpu: "15m"
            limits:
              memory: "1Gi"
              cpu: "150m"
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            # ConfigMap per il file di configurazione
            - name: config
              mountPath: /etc/loki
              readOnly: true
            # PersistentVolumeClaim per storage log
            - name: loki-storage
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-pvc
