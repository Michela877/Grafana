apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472 
      containers:
      - name: grafana
        image: grafana/grafana:12.3.1 #12.2.1 fino a qui verificata e funzioinante creato inizialmente con latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: grafana-smtp-secret
        resources:
          requests:
            memory: "150Mi"
            cpu: "10m"
          limits:
            memory: "300Mi"
            cpu: "100m"
        securityContext:
          runAsUser: 472
          runAsGroup: 472
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: storage  # AGGIUNGI QUESTO
          mountPath: /var/lib/grafana
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: storage  # AGGIUNGI QUESTO
        persistentVolumeClaim:
          claimName: grafana-pvc
