apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472 
      containers:
      - name: grafana
        image: grafana/grafana:12.3.1 #12.2.1 fino a qui verificata e funzioinante creato inizialmente con latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER   # inizio configurazione utenza
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin                   # fine configurazione utenza
        - name: GF_SMTP_ENABLED          # inizio configurazione smtp grafana
          value: "true"
        - name: GF_SMTP_HOST
          value: "smtp.gmail.com:587"
        - name: GF_SMTP_USER
          value: "tuoindirizzo@gmail.com"
        - name: GF_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smtp-secret
              key: password
        - name: GF_SMTP_FROM_ADDRESS
          value: "tuoindirizzo@gmail.com"
        - name: GF_SMTP_SKIP_VERIFY
          value: "true"
        - name: GF_SMTP_STARTTLS_POLICY
          value: "Opportunistic"         # fine configurazione smtp grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsUser: 472
          runAsGroup: 472
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: storage  # AGGIUNGI QUESTO
          mountPath: /var/lib/grafana
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: storage  # AGGIUNGI QUESTO
        persistentVolumeClaim:
          claimName: grafana-pvc
