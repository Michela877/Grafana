---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-conf
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    clients:
      - url: http://loki:3100/loki/api/v1/push
        backoff_config:
          min_period: 1s
          max_period: 30s
          max_retries: 20
        batchwait: 1s
        batchsize: 1048576
        timeout: 10s

    positions:
      filename: /run/promtail/positions.yaml

    scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod
      pipeline_stages:
      - cri: {}
      - labeldrop:
        - filename
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_uid]
        target_label: instance
        action: replace
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
        action: replace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
        action: replace
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
        action: replace
      - source_labels: [__meta_kubernetes_pod_annotation_kubernetes_io_config_mirror]
        action: drop
        regex: ".+"
      - action: replace
        source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - action: replace
        replacement: $1
        separator: /
        source_labels:
        - __meta_kubernetes_pod_namespace
        - __meta_kubernetes_pod_name
        target_label: job
      - action: replace
        source_labels: [__meta_kubernetes_pod_name]
        target_label: service

    - job_name: kubernetes-system
      static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log

    - job_name: kubernetes-system-containers
      static_configs:
      - targets:
          - localhost
        labels:
          job: system-containers
          __path__: /var/log/containers/*.log
      pipeline_stages:
      - cri: {}
      - labeldrop:
        - filename

    - job_name: journal
      journal:
        max_age: 12h
        labels:
          job: systemd-journal
      relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal__hostname']
        target_label: 'node'
      - source_labels: ['__journal_syslog_identifier']
        target_label: 'syslog_identifier'
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: promtail
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      containers:
      - name: promtail
        image: grafana/promtail:2.9.3
        args:
          - --config.file=/etc/promtail/promtail.yaml
          - --client.external-labels=cluster=local
        env:
          - name: LOKI_URL
            value: "http://10.110.82.123:3100/loki/api/v1/push"
        ports:
        - containerPort: 9080
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          periodSeconds: 10
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: promtail-config
          mountPath: /etc/promtail
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlib
          mountPath: /var/lib
          readOnly: true
        - name: run
          mountPath: /run/promtail
        - name: positions
          mountPath: /var/lib/promtail
        - name: dockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: journal
          mountPath: /var/log/journal
          readOnly: true
        - name: etcmachineid
          mountPath: /etc/machine-id
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
      volumes:
      - name: promtail-config
        configMap:
          name: promtail-conf
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlib
        hostPath:
          path: /var/lib
      - name: run
        hostPath:
          path: /run/promtail
      - name: positions
        hostPath:
          path: /var/lib/promtail
      - name: dockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: journal
        hostPath:
          path: /var/log/journal
      - name: etcmachineid
        hostPath:
          path: /etc/machine-id
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - extensions
  resources:
  - podsecuritypolicies
  verbs:
  - use
  resourceNames:
  - promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
- kind: ServiceAccount
  name: promtail
  namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  clusterIP: None
  ports:
  - name: http
    port: 9080
    targetPort: http
  selector:
    app: promtail
