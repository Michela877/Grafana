apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      hostNetwork: false
      hostPID: true
      serviceAccountName: promtail
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      containers:
      - name: promtail
        image: grafana/promtail:3.6.3 # creato inizialmente con la 2.9.3
        args:
          - --config.file=/etc/promtail/promtail.yaml
          - --client.external-labels=cluster=local
        env:
          - name: LOKI_URL
            value: "http://loki:3100/loki/api/v1/push"
        ports:
        - containerPort: 9080
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          periodSeconds: 10
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          privileged: false  # CAMBIATO DA true A false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Deve essere false per scrivere positions
          capabilities:
            drop:
              - ALL
            add:
              - DAC_OVERRIDE  # Permette di leggere file di altri utenti
        volumeMounts:
        - name: promtail-config
          mountPath: /etc/promtail
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlib
          mountPath: /var/lib
          readOnly: true
        - name: run
          mountPath: /run/promtail
        - name: positions
          mountPath: /var/lib/promtail
        - name: dockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: journal
          mountPath: /var/log/journal
          readOnly: true
        - name: etcmachineid
          mountPath: /etc/machine-id
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
      volumes:
      - name: promtail-config
        configMap:
          name: promtail-conf
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlib
        hostPath:
          path: /var/lib
      - name: run
        hostPath:
          path: /run/promtail
      - name: positions
        hostPath:
          path: /var/lib/promtail
      - name: dockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: journal
        hostPath:
          path: /var/log/journal
      - name: etcmachineid
        hostPath:
          path: /etc/machine-id