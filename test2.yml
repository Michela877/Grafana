apiVersion: v1
kind: Pod
metadata:
  name: complete-trace-pod
  namespace: testapp
spec:
  restartPolicy: Never
  containers:
  - name: curl-test
    image: curlimages/curl
    command: ["sh", "-c"]
    args:
      - |
        echo "Invio trace completa per /api/news/all/1..."
        
        # Trace ID comune per tutti gli span
        TRACE_ID="1234567890abcdef1234567890abcdef"
        TIMESTAMP=$(date +%s)000000
        
        curl -X POST http://tempo.monitoring.svc.cluster.local:9411/api/v2/spans \
          -H "Content-Type: application/json" \
          -d '[
            {
              "traceId": "'${TRACE_ID}'",
              "id": "1111111111111111",
              "parentId": "",
              "name": "HTTP GET /api/news/all/1",
              "timestamp": '${TIMESTAMP}',
              "duration": 45000000,
              "kind": "SERVER",
              "localEndpoint": {
                "serviceName": "servizi-service"
              },
              "tags": {
                "http.method": "GET",
                "http.path": "/api/news/all/1",
                "http.route": "/api/news/all/1",
                "http.status_code": "200",
                "span.kind": "server",
                "component": "http"
              }
            },
            {
              "traceId": "'${TRACE_ID}'",
              "id": "2222222222222222",
              "parentId": "1111111111111111",
              "name": "DB Query - News",
              "timestamp": '$(($TIMESTAMP + 5000000))',
              "duration": 15000000,
              "kind": "CLIENT",
              "localEndpoint": {
                "serviceName": "servizi-service"
              },
              "tags": {
                "db.system": "postgresql",
                "db.name": "servizi",
                "db.operation": "SELECT",
                "db.sql.table": "news",
                "span.kind": "client"
              }
            },
            {
              "traceId": "'${TRACE_ID}'",
              "id": "3333333333333333",
              "parentId": "1111111111111111",
              "name": "Cache Lookup",
              "timestamp": '$(($TIMESTAMP + 25000000))',
              "duration": 5000000,
              "kind": "CLIENT",
              "localEndpoint": {
                "serviceName": "servizi-service"
              },
              "tags": {
                "cache.operation": "GET",
                "cache.key": "news:all:1",
                "span.kind": "client"
              }
            }
          ]'
        
        echo "Trace completa inviata con ID: ${TRACE_ID}"
        echo "Puoi cercare in Tempo con: {service.name=\"servizi-service\"}"